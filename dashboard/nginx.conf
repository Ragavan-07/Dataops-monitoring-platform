server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the FastAPI container (service name "api" in docker-compose).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
